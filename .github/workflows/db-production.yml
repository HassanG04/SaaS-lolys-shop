name: Deploy Database to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PRODUCTION to confirm deployment to production'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: db-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.2
        with:
          version: 2.120.0
      - name: Link Production Project
        run: supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$PRODUCTION_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      - name: Push Migrations to Production
        run: supabase db push --password "$PRODUCTION_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
