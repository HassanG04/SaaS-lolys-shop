name: Static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare pinned scanner with Node on the host
        shell: bash
        run: |
          set -euo pipefail
          docker pull semgrep/semgrep:1.179.0@sha256:cab19964e6c93019934252a9cd591d9b27df1e5b5d1734b26f4069ae51c295f8
          wrapper="$RUNNER_TEMP/lolys-semgrep"
          cat > "$wrapper" <<'SCANNER'
          #!/usr/bin/env bash
          set -euo pipefail
          mounts=(--mount "type=bind,source=$PWD,target=$PWD,readonly")
          if [[ "$PWD" != "$GITHUB_WORKSPACE" ]]; then
            mounts+=(--mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly")
          fi
          exec docker run --rm "${mounts[@]}" --workdir "$PWD" \
            --env SEMGREP_SEND_METRICS=off --env SEMGREP_ENABLE_VERSION_CHECK=0 \
            --entrypoint semgrep \
            semgrep/semgrep:1.179.0@sha256:cab19964e6c93019934252a9cd591d9b27df1e5b5d1734b26f4069ae51c295f8 "$@"
          SCANNER
          chmod +x "$wrapper"
          echo "SEMGREP_BIN=$wrapper" >> "$GITHUB_ENV"
      - name: Prove project-rule rejection and recovery
        run: node --test scripts/test-semgrep.mjs
      - name: Scan browser source with project and maintained rules
        run: node scripts/check-sast.mjs
